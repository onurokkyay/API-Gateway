spring:
  application:
    name: api-gateway
  config:
    # Required, not optional. A gateway that starts without its routes is worse than one that
    # does not start: it answers 404 to everything while looking healthy. Failing loudly is the
    # honest behaviour, and the retry below covers the ordinary case of the config server simply
    # being slower to come up than its clients.
    import: "configserver:"
  cloud:
    config:
      # Named explicitly rather than inherited from spring.application.name. The config server
      # serves <name>.yml, and leaving it implicit resolved to the Gradle project name instead:
      # the server happily returned the shared application.yml, the gateway started without
      # routes or a JWKS location, and the first sign of trouble was a missing ReactiveJwtDecoder
      # bean rather than anything that mentioned configuration.
      name: api-gateway
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-interval: 5000
        max-attempts: 12

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.krawenn.gateway: ${GATEWAY_LOG_LEVEL:INFO}
