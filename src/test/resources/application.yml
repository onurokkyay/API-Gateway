# Test configuration. It replaces the packaged application.yml on the test classpath, so the tests
# run without routes: none of them goes through one.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never fetched: no test here presents a token to be verified. It exists because the
          # resource-server auto-configuration needs somewhere to point.
          jwk-set-uri: http://localhost:0/.well-known/jwks.json
          issuer-uri: http://localhost:0
          audiences:
            - auth-service-clients

gateway:
  rate-limit:
    enabled: false
    per-minute: 300
    sign-in-per-minute: 10
    trust-forwarded-for: false
  cors:
    allowed-origins: http://localhost:3000
