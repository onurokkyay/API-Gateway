name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build, lint and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t api-gateway:ci .

      # The image is started, not only built. A gateway whose entrypoint names a class the
      # `tools` jarmode does not ship builds perfectly and dies on first run.
      #
      # It is started with the config client disabled, because the thing under test is the
      # image, not whether a config server happens to be reachable from a CI runner. In
      # production that import is mandatory and this override is absent.
      - name: Start it and wait for the application to report healthy
        run: |
          docker run -d --name gateway-ci --network host \
            -e SPRING_CONFIG_LOCATION=file:/app/ci/standalone.yml \
            -v "$PWD/ci:/app/ci:ro" \
            api-gateway:ci

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Gateway answered on attempt $attempt"
              docker logs gateway-ci | grep -E "Started GatewayApplication"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' gateway-ci)" != "true" ]; then
              echo "Container exited before answering:"
              docker logs gateway-ci
              exit 1
            fi
            sleep 2
          done

          echo "Gateway never answered:"
          docker logs gateway-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs gateway-ci || true
