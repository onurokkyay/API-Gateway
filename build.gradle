plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.9.0'
}

group = 'com.krawenn'
version = '0.1.0-SNAPSHOT'
description = 'Edge gateway: routing, token verification and identity propagation'

java {
    toolchain {
        // Auto-provisioning is disabled (gradle.properties); resolves to the locally
        // installed JDK 25.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Spring Cloud 2025.1.x is built and tested against Spring Boot 4.0.x, which is why the
    // gateway sits on 4.0 while the auth service is on 4.1. They share no classpath -- two
    // JVMs, one HTTP contract -- so matching each service to the version its own framework
    // train supports beats keeping a single number across the estate.
    springCloudVersion = '2025.1.3'
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // Verifies RS256 access tokens against the auth service's JWKS. Reactive decoding is
    // selected automatically because this is a WebFlux application.
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // No rate limiter here yet, deliberately. Gateway rate limiting means Redis for the token
    // buckets, and the threat it would answer -- password guessing -- is already answered by
    // the auth service's per-account lockout. Add it when there is a reason a per-IP limit
    // catches something the lockout does not, such as registration spam once this is public.

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    maxWarnings = 0
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target '*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target '*.md', '.gitignore', 'src/**/*.yml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('bootJar') {
    archiveFileName = 'api-gateway.jar'
    layered {
        enabled = true
    }
}

tasks.named('jar') {
    // Do not produce the plain (non-executable) jar alongside the boot jar.
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
